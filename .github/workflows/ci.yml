name: CI/CD Pipeline
#
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  # ── Job 1 : Backend .NET ───────────────────────────────────
  backend:
    name: Build & Test Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore
        working-directory: planProject-Backend

      - name: Build
        run: dotnet build --no-restore -c Release
        working-directory: planProject-Backend

      - name: Run tests
        run: dotnet test --no-build -c Release --verbosity normal
        working-directory: planProject-Backend

  # ── Job 2 : Frontend React ────────────────────────────────
  frontend:
    name: Build & Test Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: planProject-Frontend/package-lock.json

      - name: Install dependencies
        run: npm install
        working-directory: planProject-Frontend

      - name: Build
        run: npm run build
        working-directory: planProject-Frontend

  # ── Job 3 : IA Service FastAPI ────────────────────────────
  ia-service:
    name: Build IA Service
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: ia-service/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt
        working-directory: ia-service

      - name: Check FastAPI app imports correctly
        run: python -c "import main; print('✅ main.py OK')"
        working-directory: ia-service

  # ── Job 4 : Docker Build ──────────────────────────────────
  docker:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [backend, frontend, ia-service]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env for CI
        run: |
          cat > planProject-Backend/.env << EOF
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=testpassword
          POSTGRES_DB=PlanDB_test
          JWT_SECRET=testSecretKeyForCIOnly123456789
          EMAIL_HOST=smtp.gmail.com
          EMAIL_PORT=587
          EMAIL_USERNAME=test@test.com
          EMAIL_PASSWORD=testpassword
          EMAIL_FROM=test@test.com
          EOF

      - name: Build API Docker image
        run: docker build -t planproject-api .
        working-directory: planProject-Backend

      - name: Build Frontend Docker image
        run: docker build -t planproject-frontend .
        working-directory: planProject-Frontend

      - name: Build IA Service Docker image
        run: docker build -t planproject-ia .
        working-directory: ia-service

  # ── Job 5 : CD — Push Docker Hub ─────────────────────────
  deploy:
    name: Push to Docker Hub
    runs-on: ubuntu-latest
    needs: [docker]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Create .env for build
        run: |
          cat > planProject-Backend/.env << EOF
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=testpassword
          POSTGRES_DB=PlanDB_test
          JWT_SECRET=testSecretKeyForCIOnly123456789
          EMAIL_HOST=smtp.gmail.com
          EMAIL_PORT=587
          EMAIL_USERNAME=test@test.com
          EMAIL_PASSWORD=testpassword
          EMAIL_FROM=test@test.com
          EOF

      - name: Build & Push API
        uses: docker/build-push-action@v5
        with:
          context: ./planProject-Backend
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/planproject-api:latest
            ${{ secrets.DOCKER_USERNAME }}/planproject-api:${{ github.sha }}

      - name: Build & Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./planProject-Frontend
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/planproject-frontend:latest
            ${{ secrets.DOCKER_USERNAME }}/planproject-frontend:${{ github.sha }}

      - name: Build & Push IA Service
        uses: docker/build-push-action@v5
        with:
          context: ./ia-service
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/planproject-ia:latest
            ${{ secrets.DOCKER_USERNAME }}/planproject-ia:${{ github.sha }}