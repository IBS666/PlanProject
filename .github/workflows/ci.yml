name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  # ── Job 1 : Backend .NET ───────────────────────────────────
  backend:
    name: Build & Test Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore
        working-directory: planProject-Backend

      - name: Build
        run: dotnet build --no-restore -c Release
        working-directory: planProject-Backend

      - name: Run tests
        run: dotnet test --no-build -c Release --verbosity normal
        working-directory: planProject-Backend

  # ── Job 2 : Frontend React ────────────────────────────────
  frontend:
    name: Build & Test Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: planProject-Frontend/package-lock.json

      - name: Install dependencies
        run: npm install
        working-directory: planProject-Frontend

      - name: Build
        run: npm run build
        working-directory: planProject-Frontend

  # ── Job 3 : IA Service FastAPI ────────────────────────────
  ia-service:
    name: Build IA Service
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: ia-service/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt
        working-directory: ia-service

      - name: Check FastAPI app imports correctly
        run: python -c "import main; print('✅ main.py OK')"
        working-directory: ia-service

  # ── Job 4 : Docker Build ──────────────────────────────────
  docker:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [backend, frontend, ia-service]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env for CI
        run: |
          cat > planProject-Backend/.env << EOF
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=testpassword
          POSTGRES_DB=PlanDB_test
          JWT_SECRET=testSecretKeyForCIOnly123456789
          EMAIL_HOST=smtp.gmail.com
          EMAIL_PORT=587
          EMAIL_USERNAME=test@test.com
          EMAIL_PASSWORD=testpassword
          EMAIL_FROM=test@test.com
          EOF

      - name: Build Docker images
        run: |
          docker build -t planproject-api:${{ github.sha }} ./planProject-Backend
          docker build -t planproject-frontend:${{ github.sha }} ./planProject-Frontend
          docker build -t planproject-ia:${{ github.sha }} ./ia-service

      - name: Save images to tar
        run: |
          docker save planproject-api:${{ github.sha }} \
                      planproject-frontend:${{ github.sha }} \
                      planproject-ia:${{ github.sha }} \
            | gzip > docker-images.tar.gz

      - name: Cache Docker images
        uses: actions/cache/save@v4
        with:
          path: docker-images.tar.gz
          key: docker-images-${{ github.sha }}

  # ── Job 5 : CD — Push Docker Hub ─────────────────────────
  deploy:
    name: Push to Docker Hub
    runs-on: ubuntu-latest
    needs: [docker]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Restore Docker images from cache
        uses: actions/cache/restore@v4
        with:
          path: docker-images.tar.gz
          key: docker-images-${{ github.sha }}
          fail-on-cache-miss: true

      - name: Load images
        run: docker load < docker-images.tar.gz

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Tag & Push API
        run: |
          docker tag planproject-api:${{ github.sha }} ${{ secrets.DOCKER_USERNAME }}/planproject-api:latest
          docker tag planproject-api:${{ github.sha }} ${{ secrets.DOCKER_USERNAME }}/planproject-api:${{ github.sha }}
          docker push ${{ secrets.DOCKER_USERNAME }}/planproject-api:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/planproject-api:${{ github.sha }}

      - name: Tag & Push Frontend
        run: |
          docker tag planproject-frontend:${{ github.sha }} ${{ secrets.DOCKER_USERNAME }}/planproject-frontend:latest
          docker tag planproject-frontend:${{ github.sha }} ${{ secrets.DOCKER_USERNAME }}/planproject-frontend:${{ github.sha }}
          docker push ${{ secrets.DOCKER_USERNAME }}/planproject-frontend:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/planproject-frontend:${{ github.sha }}

      - name: Tag & Push IA Service
        run: |
          docker tag planproject-ia:${{ github.sha }} ${{ secrets.DOCKER_USERNAME }}/planproject-ia:latest
          docker tag planproject-ia:${{ github.sha }} ${{ secrets.DOCKER_USERNAME }}/planproject-ia:${{ github.sha }}
          docker push ${{ secrets.DOCKER_USERNAME }}/planproject-ia:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/planproject-ia:${{ github.sha }}